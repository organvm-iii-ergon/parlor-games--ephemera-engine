name: T046 artifact integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t046-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact-integration:
    name: Dossier render integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install artifact renderer dependencies
        working-directory: artifacts
        run: npm ci

      - name: Install app test dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck artifact renderer
        working-directory: artifacts
        run: npm run typecheck

      - name: Run focused Dossier artifact integration test
        working-directory: app
        run: npm test -- tests/integration/artifactGeneration.test.ts

      - name: Verify generated PDF cleanup
        run: test ! -e app/test-output/test-dossier.pdf

      - name: Reject tracked-file drift
        run: git diff --exit-code
